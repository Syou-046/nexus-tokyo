<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベント | NEXUS TOKYO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue:   #20A0E0;
  --teal:   #40C0A0;
  --green:  #60E080;
  --navy:   #0D0D1F;
  --navy2:  #141428;
  --navy3:  #1C1C38;
  --navy4:  #252545;
  --muted:  #B0B8D8;
  --dim:    #3A3A60;
  --white:  #F0F4FF;
  --r: 10px;
  --rs: 6px;
}
html { scroll-behavior: smooth; overflow-x: hidden; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: var(--navy);
  color: var(--white);
  line-height: 1.65;
  overflow-x: hidden;
  max-width: 100vw;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(32,160,224,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(32,160,224,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}

/* NAV */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(13,13,31,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--dim);
  box-shadow: 0 1px 24px rgba(32,160,224,0.08);
  padding: 0 clamp(1.25rem, 5vw, 3.5rem);
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo img { height: 52px; width: auto; filter: brightness(0) invert(1); }
.nav-logo { text-decoration: none; display: flex; align-items: center; }
.nav-links { display: flex; gap: 1.75rem; list-style: none; }
.nav-links a {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.8rem; font-weight: 500;
  color: var(--muted); text-decoration: none; letter-spacing: 0.02em;
  transition: color 0.15s;
}
.nav-links a:hover { color: var(--blue); }
.nav-links a.active { color: var(--teal); }

.nav-burger {
  display: none;
  flex-direction: column; justify-content: center; gap: 5px;
  width: 36px; height: 36px; cursor: pointer;
  background: none; border: none; padding: 4px;
}
.nav-burger span {
  display: block; height: 2px; border-radius: 2px;
  background: var(--white);
  transition: transform 0.3s, opacity 0.3s;
}
.nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.nav-burger.open span:nth-child(2) { opacity: 0; }
.nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.mobile-menu {
  display: none;
  position: fixed; inset: 0; top: 64px; z-index: 99;
  background: rgba(13,13,31,0.97);
  backdrop-filter: blur(20px);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 2rem;
  opacity: 0; pointer-events: none;
  transition: opacity 0.3s;
}
.mobile-menu.open { opacity: 1; pointer-events: all; }
.mobile-menu a {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 1.4rem; font-weight: 700;
  color: var(--white); text-decoration: none;
  letter-spacing: 0.04em;
  transition: color 0.2s;
}
.mobile-menu a:hover { color: var(--teal); }

/* SECTIONS */
section {
  position: relative; z-index: 1;
  padding: clamp(3rem, 6vw, 5rem) clamp(1.25rem, 5vw, 3.5rem);
  max-width: 1100px; margin: 0 auto;
}

.page-header {
  padding: clamp(3rem, 6vw, 5rem) clamp(1.25rem, 5vw, 3.5rem) 2rem;
  max-width: 1100px; margin: 0 auto;
  position: relative; z-index: 1;
}
.page-title {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: clamp(2rem, 5vw, 3.5rem);
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, #80FFB0 0%, #40D4B8 40%, #38BFFF 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  filter: drop-shadow(0 0 18px rgba(64,212,184,0.4));
  margin-bottom: 0.5rem;
}
.page-sub {
  color: var(--muted); font-size: 0.9rem;
}

/* TABS */
.tabs {
  display: flex; gap: 0.5rem;
  margin-bottom: 2rem;
  border-bottom: 1px solid var(--dim);
  padding-bottom: 0;
}
.tab-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.85rem; font-weight: 600;
  color: var(--muted);
  background: none; border: none;
  padding: 0.6rem 1.2rem;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color 0.2s, border-color 0.2s;
}
.tab-btn.active { color: var(--teal); border-bottom-color: var(--teal); }
.tab-btn:hover { color: var(--white); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* EVENT CARDS */
.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.25rem;
}
.event-card {
  background: rgba(20,20,40,0.6);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(32,160,224,0.15);
  border-radius: var(--r); overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
}
.event-card:hover {
  border-color: rgba(32,160,224,0.6);
  box-shadow: 0 0 28px rgba(32,160,224,0.2);
  transform: translateY(-4px);
}
.event-thumb {
  height: 160px;
  background: linear-gradient(135deg, rgba(32,160,224,0.1), rgba(64,192,160,0.08));
  border-bottom: 1px solid var(--dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; position: relative;
}
.event-thumb img {
  width: 100%; height: 100%; object-fit: cover;
}
.status-badge {
  position: absolute; top: 10px; left: 10px;
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  padding: 3px 8px; border-radius: var(--rs); letter-spacing: 0.06em;
}
.badge-upcoming { color: var(--green); background: rgba(96,224,128,0.1); border: 1px solid rgba(96,224,128,0.3); }
.badge-past { color: var(--muted); background: rgba(100,100,150,0.1); border: 1px solid rgba(100,100,150,0.3); }

.event-body { padding: 1.25rem; }
.event-date { font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--blue); margin-bottom: 0.35rem; }
.event-name { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--white); margin-bottom: 0.5rem; }
.event-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 1rem; line-height: 1.7; }
.event-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--dim); padding-top: 0.75rem; }
.event-loc { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--muted); }
.event-btn {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 0.75rem; font-weight: 700;
  padding: 6px 14px; border-radius: var(--rs);
  cursor: pointer; border: none; text-decoration: none;
  transition: background 0.2s;
}
.btn-join { background: linear-gradient(135deg, var(--teal), var(--blue)); color: #fff; }
.btn-join:hover { opacity: 0.85; }
.btn-past { background: rgba(100,100,150,0.15); color: var(--muted); border: 1px solid var(--dim); cursor: default; }

/* EMPTY STATE */
.empty {
  grid-column: 1/-1;
  text-align: center; padding: 4rem 1.5rem;
  background: rgba(20,20,40,0.4);
  border: 1px dashed var(--dim);
  border-radius: var(--r);
  color: var(--muted); font-size: 0.85rem;
}
.empty-icon { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; }

/* REVEAL */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.55s ease, transform 0.55s ease; }
.reveal.visible { opacity: 1; transform: none; }

/* FOOTER */
footer {
  position: relative; z-index: 1;
  text-align: center;
  padding: 2rem;
  border-top: 1px solid var(--dim);
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem; color: var(--muted);
}

@media (max-width: 700px) {
  .nav-links { display: none; }
  .nav-burger { display: flex; }
  .mobile-menu { display: flex; }
  .events-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html"><img src="logo.png" alt="NEXUS TOKYO"></a>
  <ul class="nav-links">
    <li><a href="index.html#about">について</a></li>
    <li><a href="index.html#pillars">活動</a></li>
    <li><a href="events.html" class="active">イベント</a></li>
    <li><a href="index.html#gallery">ギャラリー</a></li>
    <li><a href="index.html#contact">お問い合わせ</a></li>
  </ul>
  <button class="nav-burger" id="burger" aria-label="メニュー">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="mobile-menu" id="mobile-menu">
  <a href="index.html#about" class="mobile-link">について</a>
  <a href="index.html#pillars" class="mobile-link">活動</a>
  <a href="events.html" class="mobile-link">イベント</a>
  <a href="index.html#gallery" class="mobile-link">ギャラリー</a>
  <a href="index.html#contact" class="mobile-link">お問い合わせ</a>
</div>

<div class="page-header">
  <h1 class="page-title">イベント</h1>
  <p class="page-sub">NEXUS TOKYOが開催するイベントの一覧です。</p>
</div>

<section>
  <div class="tabs">
    <button class="tab-btn active" data-tab="upcoming">開催予定</button>
    <button class="tab-btn" data-tab="past">過去のイベント</button>
  </div>

  <!-- 開催予定 -->
  <div class="tab-panel active" id="tab-upcoming">
    <div class="events-grid">
      <div class="empty reveal">
        <div class="empty-icon">📅</div>
        <p>現在イベントを準備中です。<br>もうすぐお知らせします。</p>
      </div>

      <!-- イベントを追加するときはここにコピー
      <div class="event-card reveal">
        <div class="event-thumb">
          <span class="status-badge badge-upcoming">UPCOMING</span>
          🎤
        </div>
        <div class="event-body">
          <p class="event-date">2025.00.00 (X) 00:00〜</p>
          <p class="event-name">イベント名</p>
          <p class="event-desc">イベントの説明文をここに書く。</p>
          <div class="event-footer">
            <span class="event-loc">📍 場所</span>
            <a href="#" class="event-btn btn-join">参加する</a>
          </div>
        </div>
      </div>
      -->
    </div>
  </div>

  <!-- 過去のイベント -->
  <div class="tab-panel" id="tab-past">
    <div class="events-grid">
      <div class="empty reveal">
        <div class="empty-icon">📦</div>
        <p>過去のイベントはまだありません。</p>
      </div>

      <!-- 過去イベントを追加するときはここにコピー
      <div class="event-card reveal">
        <div class="event-thumb">
          <span class="status-badge badge-past">PAST</span>
          🎤
        </div>
        <div class="event-body">
          <p class="event-date">2025.00.00 (X)</p>
          <p class="event-name">イベント名</p>
          <p class="event-desc">イベントの説明文。</p>
          <div class="event-footer">
            <span class="event-loc">📍 場所</span>
            <span class="event-btn btn-past">終了</span>
          </div>
        </div>
      </div>
      -->
    </div>
  </div>
</section>

<footer>© 2025 NEXUS TOKYO. All rights reserved.</footer>

<script>
// Hamburger
const burger = document.getElementById('burger');
const mobileMenu = document.getElementById('mobile-menu');
burger.addEventListener('click', () => {
  burger.classList.toggle('open');
  mobileMenu.classList.toggle('open');
});
document.querySelectorAll('.mobile-link').forEach(link => {
  link.addEventListener('click', () => {
    burger.classList.remove('open');
    mobileMenu.classList.remove('open');
  });
});

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
});

// Reveal
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
}, { threshold: 0.08 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
